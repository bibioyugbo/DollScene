<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F0EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0B10" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="DollScene: Steal the Scene. Style your world. An 18+ fashion and social life sim." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@600;700;800;900&family=Space+Grotesk:wght@500;700&family=Bagel+Fat+One&family=Nunito:wght@900&display=swap"
      rel="stylesheet"
    />
    <title>DollScene</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('dollscene-store') || '{}');
        var t = s && s.state && s.state.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
